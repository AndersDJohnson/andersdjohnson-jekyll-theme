name: Notify consumers

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # Owner of the consumer repositories listed in _sites.yml.
  CONSUMER_OWNER: ${{ github.repository_owner }}
  # Event type sent as a repository_dispatch to each consumer.
  EVENT_TYPE: theme-updated

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger rebuild in each consumer
        env:
          # Personal access token (or app token) with write access to consumer repos.
          GH_TOKEN: ${{ secrets.CONSUMERS_TOKEN }}
        run: |
          for site in $(yq '.sites[]' _sites.yml); do
            echo "Dispatching $EVENT_TYPE to $CONSUMER_OWNER/$site"
            gh api "repos/$CONSUMER_OWNER/$site/dispatches" \
              -f event_type="$EVENT_TYPE" \
              -f "client_payload[sha]=$GITHUB_SHA" \
              || echo "::warning::Failed to notify $site"
          done
